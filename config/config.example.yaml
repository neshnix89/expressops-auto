# ExpressOPS Automation Configuration
# Copy this to config.yaml and fill in your actual values.
# config.yaml is gitignored — NEVER commit it.

# Default run mode: mock (safe) or live
mode: mock

# JIRA On-Premises
# NPI Work Containers span many project keys (USRE, POSX, LCUSAMB, NPIOTHER,
# SILED2, ...) — queries filter by issue type + Order Type, not by project.
jira:
  base_url: "https://pfjira.pepperl-fuchs.com"
  pat: "YOUR_JIRA_PAT_HERE"
  verify_ssl: false

# Confluence
confluence:
  base_url: "https://pfteamspace.pepperl-fuchs.com"
  pat: "YOUR_CONFLUENCE_PAT_HERE"
  space_key: "EUDEMHTM0021"

# M3 ERP (ODBC)
m3:
  dsn: "ODSSG"
  schema: "PFODS"
  # Note: No timeout parameter supported for this DSN

# EDM Oracle
edm:
  # EDM requires running Python via EDMAdmin.exe (a renamed python.exe) to get
  # past SYS.PF_SEC_LOGON_TRIGGER. Leave this blank and run
  #     python scripts\setup_edmadmin.py
  # which creates EDMAdmin.exe INSIDE your Python install dir and writes the
  # real path back here. It must live beside python3xx.dll — a copy anywhere
  # else dies in the Windows loader with 0xC0000135 before running any code.
  python_exe: ""
  schema: "ADMEDP"
  # Connection string used by cx_Oracle / oracledb
  connection_string: "YOUR_EDM_CONNECTION_STRING"

# Tableau Server (REST API, PAT auth)
tableau:
  base_url: "https://pftableau.pepperl-fuchs.com"
  api_version: "3.25"
  pat_name: "Automation"
  pat_secret: "YOUR_TABLEAU_PAT_SECRET"
  content_url: ""          # default site
  verify_ssl: false

# Webex (Cisco public cloud — webexapis.com, independent of corp network)
# Used by mo_ref_order_monitor to notify build-progress groups.
webex:
  # Bot access token from developer.webex.com -> My Apps -> Create Bot.
  # Add the bot to each target space, then run discover_webex_rooms.py to get roomIds.
  bot_token: "YOUR_WEBEX_BOT_TOKEN"

# MO Ref-order-no monitor (tasks/mo_ref_order_monitor)
# Polls M3 MWOHED_AP.VHRORN per active MO and maintains the container's
# MO BUILD STATUS table + working-hours dwell summary; notifies Webex on change.
mo_ref_order_monitor:
  username: "ExpressOPS MO Monitor"        # stamped on the status table footer
  # Container universe (inherited from the Excel->Jira tool it replaces).
  jql: 'issue in relation("filter=25423", "Project Parent", Tasks, Deviations, level1) AND "Product Type" = "SMT PCBA" AND "NPI Location" = "Singapore" ORDER BY created ASC'
  # How MO numbers are recognised inside container comments (M3 MO = 10 digits, 70xxxxxxxx).
  mo_number_regex: '\b(70\d{8})\b'
  # Shown in the table when the ref order no (VHRORN) is blank, so an MO with
  # no marker yet is still visible as 'watched, not marked'.
  no_status_label: "No Status"
  # Per-MO state/history lives here (survives sync; keep out of the zip sync path).
  # SINGLE-LAPTOP default below. For a SECOND laptop sharing one history, point
  # BOTH machines' state_dir AND webex.queue_file at the same absolute network
  # path (use single quotes so backslashes stay literal), e.g.:
  #   state_dir: 'Y:\88-Technology-Innovation-SEA\_Public\ePMC_PCBA_NPI_Run_Sched\e-File for NPI\Live MO status triggering\state'
  state_dir: "outputs/mo_ref_order_monitor_state"
  # Pilot scope: restrict live runs to these containers (CLI --container wins).
  # Lives here rather than in the runner .bat because config.yaml is gitignored
  # and survives sync. Leave EMPTY to run fleet-wide over the whole JQL.
  pilot_containers: []
  #
  # Issue flag: production appends "IS" to the ref order no when the run has a
  # problem (e.g. "QM IS"). Webex is notified ONLY when this flag changes
  # (raised / cleared) — routine stage changes stay silent. JIRA still records
  # every change. Default matches a trailing IS, case-insensitive.
  issue_regex: '(?i)IS\s*$'
  # An MO first seen ALREADY at status 80/90 finished before the monitor
  # started watching: record it silently instead of posting a CLOSED row and
  # a close alert with no dwell history behind it. A later re-open still
  # resumes normally. Set false to publish those too.
  baseline_closed_on_first_sight: true
  webex:
    enabled: false                         # flip to true once a transport works
    # Transport:
    #   "desktop" — drive the Webex desktop app on the laptop (NO admin approval
    #               needed). Viable because IS-gated alerts are rare.
    #   "webhook" — Incoming Webhooks integration (needs admin approval).
    #   "bot"     — bot token + roomId (blocked by policy today).
    transport: "desktop"
    # desktop: Webex -> open the space -> space menu -> "Copy space link".
    space_link: ""                         # webexteams://im?space=... or https://eurl.io/...
    open_delay_seconds: 6                  # wait for the app to focus the space
    type_delay_seconds: 2                  # settle before pasting
    # The helper pastes the message and reads the compose box back before
    # pressing Enter, retrying the paste up to 3 times. If the log shows exit 6
    # ("compose box never held the message"), the space is slow to switch on
    # this machine — raise open_delay_seconds.
    # Undelivered alerts (laptop locked, Webex closed) are retried next run.
    queue_file: "outputs/mo_ref_order_monitor_webex_queue.json"
    max_age_hours: 12                      # drop queued alerts older than this (stale = noise)
    # Several pending alerts are posted as ONE multi-line message. Fewer Enter
    # presses = fewer chances for the desktop transport to misfire, and the
    # group sees one grouped notification.
    combine_alerts: true
    webhook_url: ""                        # webhook transport only
    default_room_id: ""                    # bot transport only
    routing: {}                            # bot transport only: marker -> roomId
    # Message templates. Placeholders:
    #   {mo} {pn} {marker} {prev_marker} {prev_dwell} {issue_dwell}
    #   {total_dwell} {status} {container} {url} {order_type} {responsible}
    # Omit a key to use the built-in default (plain text for "desktop",
    # markdown for the API transports). Multi-line bodies are flattened to one
    # line for "desktop" because Enter sends the message.
    messages: {}

# Anthropic API (for AI-powered analysis)
anthropic:
  api_key: "YOUR_ANTHROPIC_API_KEY"
  model: "claude-sonnet-4-20250514"

# ACTIVE/ACTIVE — two laptops running the same automations
# Point BOTH machines at the same network folder and each task takes a lock
# there before it writes. Either laptop then covers when the other is off,
# asleep or broken, without two machines posting the same JIRA comment or
# racing the same Confluence page.
#   * blank  -> no locking (single-machine setup)
#   * unreachable at run time -> the task logs a warning and runs anyway, because
#     a missed report is worse than a rare double-write
# The costing task's go-live baseline is also stored here, so seeding on one
# laptop switches both on. Use single quotes so backslashes stay literal.
shared_dir: ''
# Above the worst-case runtime of the slowest task, not the average: a lock this
# old is treated as abandoned and taken over.
run_lock_ttl_minutes: 20

# Logging
logging:
  level: "INFO"
  log_dir: "logs"

# Existing Confluence page IDs (reference)
pages:
  mr_status_report: 560866215
  kpi_dashboard: 560871424
  to_status_check: 572178513
  bom_scanner: 572180443
  # KPI overlay cache: live_kpi writes kpi_cache.json as an attachment here;
  # the Tampermonkey "JIRA KPI Overlay" userscript downloads it to draw pills.
  kpi_overlay_cache: 572629046
  # Create a Confluence page for the MO-trigger staging table and put its
  # ID here so `--publish` knows where to write.
  mo_trigger_comment: 0

# MO-trigger comment assembler (tasks/mo_trigger_comment)
# Every person reference in the generated comment renders as a JIRA
# `[~username]` mention, which the wiki renderer expands to a linked
# display name on read. The config therefore stores JIRA *usernames*
# for anyone who should be mentioned; `display` fields are retained
# only as readable context and as a fallback for log messages.
mo_trigger_comment:
  addressee: "Ng Ker Cheng Hazel"           # greeting only ("Hi …,") — not a mention
  qm_default_username: ""                    # JIRA login for Chern JR Daniel (fill in)
  qm_default_display: "Chern JR Daniel"
  smt_line: "Line 5"
  mo_duration_days: 4
  default_fyi:
    - username: ""                           # JIRA login (fill in)
      display: "Moghanan Thinesh Neo Wei Siang"
    - username: ""
      display: "Teo Geok Hui"
    - username: ""
      display: "Sawabi Siti Aslinda"
    - username: ""
      display: "Jainutdeen Jahabar"
    - username: ""
      display: "Ng Ker Cheng Hazel"
  duplicate_marker: "#Ref: MO-Trigger#"

# Costing + HS Code trigger/reminder loop (tasks/costing_hs_code_trigger)
# Scheduled task: posts one comment tagging the 2 costing people + the HS Code
# person when a container is ready (DMR → immediately; others → 5 prerequisite
# WPs Done/Won't Do), then re-tags whoever is still outstanding every N working
# days until each replies with a done-keyword. Usernames are the JIRA logins
# used for [~username] mentions AND for detecting each person's "Done" reply —
# they MUST be filled in for the reminder loop to converge.
costing_hs_code_trigger:
  costing_people:
    - username: "kloo"                        # JIRA login (used for [~kloo] mention + done detection)
      display: "Loo King Lun"
    - username: "yuhuang"                      # JIRA login
      display: "Yu Huang"                      # display is cosmetic/log fallback — correct if wrong
  hs_code_person:
    username: "fpangilina"                     # JIRA login
    display: "F. Pangilina"                    # correct if wrong
  ready_resolutions: ["Done", "Acknowledged", "Won't Do"]  # prerequisite-WP resolutions that count as ready (matches mo_trigger_comment)
  # A person's track auto-closes when they reply with one of these keywords
  # (e.g. "The product costing is updated." matches "updated").
  done_keywords: ["done", "updated", "completed"]
  negation_guards: ["not done", "no update", "pending"]
  reminder_interval_working_days: 2
  trigger_marker: "#Ref: CostHS-Trigger#"    # hidden footer on the initial comment
  reminder_marker: "#Ref: CostHS-Reminder#"  # hidden footer on reminders
  messages:
    trigger: |
      {costing_mentions} Please update costing for all the PNs in the container, including the PN that is not running.
      {hs_mention} Please update HS code.

      Kindly reply on this ticket once the update is done.
    reminder: |
      Reminder — the following updates are still pending:
      {outstanding_lines}

      Kindly update and reply on this ticket once done.
